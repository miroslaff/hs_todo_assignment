name: Dockerized Assesment Suite

on:
  workflow_dispatch:

jobs:
  docker-assesment-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t hs-todo-suite .

      - name: Run Playwright Suite in Docker Container
        run: docker run --rm --ipc=host hs-todo-suite