name: Todo App Test Suite

on:
  workflow_dispatch:

jobs:
  security-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your Playwright test repository into the workspace root
      - name: Checkout Test Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 3. Checkout Cypress Kitchen Sink App into a subdirectory (./app)
      - name: Checkout Cypress Kitchen Sink App
        uses: actions/checkout@v4
        with:
          repository: cypress-io/cypress-example-kitchensink
          path: app

      # 4. Install dependencies and start the Cypress Todo App on http://localhost:8080
      - name: Install App Dependencies & Start Local App
        working-directory: ./app
        run: |
          npm ci
          npm run start &

      # 5. Wait until http://localhost:8080 is live before running tests
      - name: Wait for App on localhost:8080
        run: |
          npx wait-on http://localhost:8080 --timeout 60000

      # 6. Install your Playwright test project dependencies & Playwright Browsers
      - name: Install Test Dependencies & Playwright Browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # 7. Run your Playwright Security Tests
      - name: Run Todo App Tests
        run: npm test

      # 8. Upload Allure or Playwright test report artifacts on failure/completion
      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            allure-results/
            playwright-report/
          retention-days: 14