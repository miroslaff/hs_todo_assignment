name: Todo App Test Suite

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  assesment-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Test Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Checkout Cypress Kitchen Sink App
        uses: actions/checkout@v4
        with:
          repository: cypress-io/cypress-example-kitchensink
          path: app

      - name: Install App Dependencies & Start Local App
        working-directory: ./app
        run: |
          npm ci
          npm run start &

      - name: Wait for App on localhost:8080
        run: |
          npx wait-on http://localhost:8080 --timeout 60000

      - name: Install Test Dependencies & Playwright Browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Todo App Tests
        run: npm test 

      - name: Fetch Previous History
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Restore History File
        if: always()
        run: |
          if [ -f "gh-pages-dir/history.jsonl" ]; then
            cp gh-pages-dir/history.jsonl ./history.jsonl
          fi

      - name: Generate Allure 3 Report
        if: always()
        run: npx allure generate allure-results --clean

      - name: Prepare Deployment Directory
        if: always()
        run: |
          mkdir -p deploy-dir
          cp -r allure-report/* deploy-dir/
          cp history.jsonl deploy-dir/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy-dir
          force_orphan: true