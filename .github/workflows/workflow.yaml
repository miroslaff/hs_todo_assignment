name: Todo App Test Suite

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  assesment-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Test Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Checkout Cypress Kitchen Sink App
        uses: actions/checkout@v4
        with:
          repository: cypress-io/cypress-example-kitchensink
          path: app

      - name: Install App Dependencies & Start Local App
        working-directory: ./app
        run: |
          npm ci
          npm run start &

      - name: Wait for App on localhost:8080
        run: |
          npx wait-on http://localhost:8080 --timeout 60000

      - name: Install Test Dependencies & Playwright Browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Todo App Tests
        run: npm test

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Generate Allure Report
        uses: mgrybyk/allure-report-branch-action@v1
        if: always()
        with:
          subfolder: allure-results
          gh_pages: gh-pages-dir
          copy_history: true

      - name: Flatten Report Directory Structure
        if: always()
        run: |
          if [ -d "gh-pages-dir/allure-report" ]; then
            cp -r gh-pages-dir/allure-report/* gh-pages-dir/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-dir
          force_orphan: true